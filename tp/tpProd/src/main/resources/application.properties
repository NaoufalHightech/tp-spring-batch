# --- PostgreSQL (surchargeable par variables d'environnement en production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/batchdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
# --- Spring Batch : ne rien lancer au démarrage, créer le schéma BATCH_* s'il manque
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
